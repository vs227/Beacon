<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#f0c27f;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f0c27f;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="beamGradL" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" style="stop-color:#f0c27f;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f0c27f;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c23152;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="#0f0f23" stroke="#1a1a3e" stroke-width="4"/>

  <!-- Left light beam -->
  <polygon points="210,195 60,165 60,225" fill="url(#beamGradL)" opacity="0.7"/>

  <!-- Right light beam -->
  <polygon points="302,195 452,165 452,225" fill="url(#beamGrad)" opacity="0.7"/>

  <!-- Lighthouse base/body - tapered tower -->
  <path d="M220,420 L200,420 Q195,420 195,415 L230,230 L282,230 L317,415 Q317,420 312,420 L292,420 Z" 
        fill="#e8e8e8" stroke="#1a1a2e" stroke-width="3"/>

  <!-- Red diagonal stripe on tower -->
  <path d="M240,350 L268,260 L282,260 L300,350 Z" fill="url(#stripeGrad)" opacity="0.8"/>
  <path d="M228,390 L250,310 L264,310 L308,390 Z" fill="url(#stripeGrad)" opacity="0.6"/>

  <!-- Lighthouse middle section -->
  <rect x="225" y="215" width="62" height="20" rx="3" fill="#d4d4d4" stroke="#1a1a2e" stroke-width="2.5"/>

  <!-- Lighthouse lamp room -->
  <rect x="230" y="185" width="52" height="35" rx="4" fill="#ffeaa7" stroke="#1a1a2e" stroke-width="2.5"/>

  <!-- Lamp glow -->
  <circle cx="256" cy="202" r="10" fill="#f0c27f" opacity="0.9"/>
  <circle cx="256" cy="202" r="6" fill="#fff3cd"/>

  <!-- Lighthouse top/cap -->
  <path d="M240,185 L256,155 L272,185 Z" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="2"/>

  <!-- Lighthouse platform/gallery -->
  <rect x="220" y="180" width="72" height="8" rx="2" fill="#2c2c54" stroke="#1a1a2e" stroke-width="2"/>

  <!-- Base platform -->
  <rect x="185" y="415" width="142" height="12" rx="4" fill="#2c2c54" stroke="#1a1a2e" stroke-width="2"/>
</svg>